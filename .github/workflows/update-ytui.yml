# Keeps Formula/ytui.rb on the latest OPS-NC/YTui release.
#
# Pull rather than push: YTui is public, so reading its releases needs no
# secret, and this repo's own token can commit here — no cross-repo
# credentials to manage. Runs every 3 hours and on demand
# (`gh workflow run update-ytui.yml --repo OPS-NC/homebrew-tap`).
name: update ytui

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Formula for the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo OPS-NC/YTui --json tagName --jq .tagName)
          gh release download "$tag" --repo OPS-NC/YTui --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          scripts/update-ytui.sh "$tag" "$RUNNER_TEMP/SHA256SUMS" Formula/ytui.rb
          if git diff --quiet; then echo "ytui ${tag#v} already current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ytui ${tag#v}"
          git push
